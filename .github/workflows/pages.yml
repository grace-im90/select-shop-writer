name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify product entry and saving
        run: |
          npm ci --ignore-scripts
          npm test

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        uses: actions/github-script@v7
        env:
          GH_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          script: |
            const { owner, repo } = context.repo;
            let artifact;
            for (let attempt = 0; attempt < 12; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({ owner, repo, run_id: context.runId });
              artifact = data.artifacts.find(item => item.name === process.env.GH_ARTIFACT_NAME && !item.expired);
              if (artifact) break;
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            if (!artifact) return core.setFailed('Uploaded site artifact is unavailable.');
            let deployment;
            try {
              const { data } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
                owner, repo, artifact_id: artifact.id, pages_build_version: context.sha,
                oidc_token: await core.getIDToken()
              });
              deployment = data;
            } catch (error) {
              return core.setFailed('Pages deployment request failed: HTTP ' + (error.status || 'unknown'));
            }
            const deploymentId = deployment.id || deployment.status_url?.split('/').pop() || context.sha;
            core.setOutput('page_url', deployment.page_url);
            const failed = new Set(['deployment_failed', 'deployment_perms_error', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost']);
            for (let attempt = 0; attempt < 120; attempt++) {
              await new Promise(resolve => setTimeout(resolve, 5000));
              const { data } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}', { owner, repo, deploymentId });
              if (data.status === 'succeed') {
                core.setOutput('status', 'succeed');
                core.info('GitHub Pages deployment succeeded.');
                return;
              }
              if (failed.has(data.status)) return core.setFailed('Pages deployment status: ' + data.status);
            }
            await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deploymentId}/cancel', { owner, repo, deploymentId });
            core.setFailed('GitHub Pages deployment timed out.');
      - name: Verify deployed pages and assets
        run: node tests/verify-deployment.mjs
