<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>셀렉상회 판매완료 상품</title>
  <link rel="icon" type="image/svg+xml" href="../../icon.svg?v=1">
  <link rel="manifest" href="../../manifest.webmanifest?v=1">
  <meta name="theme-color" content="#356AE6">
  <meta name="apple-mobile-web-app-title" content="셀렉상회">
  <style>
    :root{--ink:#172033;--muted:#687386;--blue:#356ae6;--soft:#eaf1ff;--line:#dfe5ed;--bg:#f4f7fb;--ok:#12a875}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}
    .top{display:flex;align-items:center;gap:24px;padding:22px 4vw;background:#fff;border-bottom:1px solid var(--line)}.brandline{color:var(--blue);font-size:10px;font-weight:800;letter-spacing:.14em}.top h1{margin:3px 0 0;font-size:26px;letter-spacing:-.04em}.top p{margin:0;padding-left:24px;border-left:1px solid var(--line);color:var(--muted);font-size:13px}.topnav{display:flex;gap:6px;margin-left:auto}.topnav a{padding:9px 13px;border-radius:8px;color:#627087;font-size:11px;font-weight:750;text-decoration:none}.topnav a.on{background:var(--blue);color:#fff}.topnav a:not(.on):hover{background:var(--soft);color:var(--blue)}
    .cloudbar{display:flex;align-items:center;gap:7px;padding:10px 4vw;border-bottom:1px solid var(--line);background:#f8faff}.cloudbar input{width:190px;height:35px;padding:0 12px;border:1px solid #d5dde7;border-radius:8px;outline:none;font-size:10px}.cloudbar button{height:35px;padding:0 12px;border:1px solid #cad6e8;border-radius:8px;background:#fff;color:#42516a;font-size:10px;font-weight:750}.cloudbar button.primary{border-color:var(--blue);background:var(--blue);color:#fff}.cloud-status{margin-left:auto;color:#718096;font-size:10px}.cloud-status.connected{color:var(--ok);font-weight:750}
    .wrap{width:min(1180px,calc(100% - 40px));margin:22px auto}.intro{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:16px}.intro h2{margin:0;font-size:24px}.intro p{margin:7px 0 0;color:var(--muted);font-size:12px}.intro-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.new{display:inline-flex;align-items:center;justify-content:center;height:41px;padding:0 16px;border-radius:9px;background:var(--blue);color:#fff;font-size:11px;font-weight:800;text-decoration:none}.new.secondary{border:1px solid #cad6e8;background:#fff;color:#42516a}.new.secondary:hover{border-color:var(--blue);color:var(--blue);background:var(--soft)}
    .summary{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:15px}.summary article{padding:16px 18px;border:1px solid var(--line);border-radius:13px;background:#fff}.summary span{color:var(--muted);font-size:10px}.summary b{display:block;margin-top:5px;font-size:23px}
    .panel{overflow:hidden;border:1px solid var(--line);border-radius:15px;background:#fff;box-shadow:0 10px 30px rgba(23,32,51,.05)}.list-search-title{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 14px 0}.list-search-title b{font-size:12px}.list-search-title span{color:var(--muted);font-size:9px}.tools{display:flex;align-items:center;gap:10px;padding:14px;border-bottom:1px solid var(--line)}.search{position:relative;flex:1}.search input{width:100%;height:40px;padding:0 13px 0 37px;border:1px solid #d6dee8;border-radius:9px;outline:none}.search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(53,106,230,.1)}.search span{position:absolute;left:13px;top:9px;color:var(--blue);font-size:18px}
    .detail-overlay{position:fixed;z-index:100;inset:0;display:grid;place-items:center;padding:20px;background:rgba(15,23,42,.55)}.detail-card{width:min(720px,100%);max-height:90vh;overflow:auto;padding:22px;border-radius:16px;background:#fff;box-shadow:0 24px 70px rgba(0,0,0,.25)}.detail-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:16px}.detail-head h2{margin:0;font-size:20px}.detail-close{width:34px;height:34px;border:0;border-radius:8px;background:#eef2f7;color:#526075;font-weight:800}.detail-section{margin-top:12px;padding:14px;border:1px solid #b9cdf8;border-radius:10px;background:#f7faff}.detail-section h3{margin:0 0 9px;font-size:11px}.detail-section p{margin:0;color:#445064;font-size:11px;line-height:1.7;white-space:pre-wrap}.detail-actions{display:grid;grid-template-columns:1fr;gap:8px;margin-top:16px}.detail-actions button{height:42px;border:0;border-radius:9px;background:var(--blue);color:#fff;font-size:11px;font-weight:800}
    .tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{padding:11px 13px;background:#f8fafd;color:#778397;font-size:9px;text-align:left}td{padding:12px 13px;border-top:1px solid #edf0f4;font-size:10.5px}.product-name{max-width:420px;overflow:hidden;text-overflow:ellipsis;font-weight:750}.muted{color:#8994a4}.money{font-weight:800;text-align:right}.actions{display:flex;gap:5px}.actions button{display:inline-flex;align-items:center;justify-content:center;height:28px;padding:0 9px;border:0;border-radius:7px;background:#edf3ff;color:var(--blue);font-size:9px;font-weight:750}.actions button.restore{background:#e9fbf5;color:#07855d}.actions button.delete{background:#fff0f0;color:#c33}.empty{padding:60px 20px;text-align:center;color:#8a95a5;font-size:11px}.pager{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;border-top:1px solid var(--line)}.pager button{height:30px;padding:0 10px;border:1px solid var(--line);border-radius:7px;background:#fff;color:#627087;font-size:9px}.pager button:disabled{opacity:.35;cursor:default}.pager span{color:#687386;font-size:10px}.status{padding:9px 14px;border-bottom:1px solid var(--line);background:#fbfcfe;color:#687386;font-size:9px}.hidden{display:none!important}
    @media(max-width:760px){.top{padding:14px 17px;flex-wrap:wrap}.top h1{font-size:20px}.top p{display:none}.topnav{display:grid;grid-template-columns:repeat(4,1fr);width:100%;margin:0}.topnav a{text-align:center;padding:9px 5px}.cloudbar{padding:9px 11px;flex-wrap:wrap}.cloudbar input{width:calc(50% - 4px)}.cloudbar button{flex:1}.cloud-status{width:100%;margin:2px 0 0;text-align:center}.wrap{width:calc(100% - 22px);margin:13px auto}.intro{align-items:start}.intro h2{font-size:20px}.intro p{font-size:10px}.intro-actions{width:100%;display:grid;grid-template-columns:1fr 1fr}.new{height:37px;padding:0 11px}.summary{grid-template-columns:1fr;gap:8px}.summary article{padding:13px}.summary b{font-size:19px}.tools{align-items:stretch;flex-direction:column}.search input{height:42px}th,td{padding:10px;font-size:9px}.detail-card{padding:17px}.product-name{max-width:230px}.hide-mobile{display:none}}
  </style>
</head>
<body>
  <header class="top"><div><div class="brandline">SELECT SHOP 343</div><h1>셀렉상회 판매완료</h1></div><p>판매완료 처리한 상품만 따로 보관합니다.</p><nav class="topnav"><a href="https://grace-im90.github.io/select-shop-writer/?app=26&new=1" target="_top">판매글 작성</a><a href="https://grace-im90.github.io/select-shop-writer/products/?app=26" target="_top">상품 목차</a><a class="on" href="https://grace-im90.github.io/select-shop-writer/products/sold/?app=26" target="_top">판매완료</a><a href="https://grace-im90.github.io/select-shop-writer/camera/?app=26" target="_top">카메라 촬영</a></nav></header>
  <section class="cloudbar">
    <input id="cloudEmail" type="email" placeholder="클라우드 로그인 이메일" autocomplete="email">
    <input id="cloudPassword" type="password" placeholder="비밀번호 6자리 이상" autocomplete="current-password">
    <button id="cloudLogin" class="primary" type="button">로그인</button>
    <button id="cloudSignup" type="button">회원가입</button>
    <button id="cloudLogout" class="hidden" type="button">로그아웃</button>
    <button id="cloudSync" class="hidden" type="button">↻ 지금 동기화</button>
    <span id="cloudStatus" class="cloud-status">클라우드 연결 준비 중…</span>
  </section>
  <main class="wrap">
    <div class="intro"><div><h2>판매완료 상품</h2><p>상품 목차에서 판매완료 처리한 상품만 이 페이지에 표시됩니다.</p></div><div class="intro-actions"><a class="new secondary" href="https://grace-im90.github.io/select-shop-writer/products/?app=26" target="_top">상품 목차로</a><a class="new" href="https://grace-im90.github.io/select-shop-writer/?app=26&new=1" target="_top">＋ 새 판매글 작성</a></div></div>
    <section class="summary"><article><span>판매완료</span><b id="soldTotal">0개</b></article><article><span>판매중 상품</span><b id="activeTotal">0개</b></article></section>
    <section class="panel">
      <div class="list-search-title"><b>판매완료 검색</b><span>상품명·브랜드·사이즈로 검색합니다.</span></div>
      <div class="tools"><div class="search"><span>⌕</span><input id="query" placeholder="상품명·브랜드·사이즈 검색" autocomplete="off"></div></div>
      <div id="status" class="status">판매완료 상품을 불러오는 중입니다.</div>
      <div class="tablewrap"><table><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table><div id="empty" class="empty hidden"></div></div>
      <div class="pager"><button id="prev">이전</button><span id="pageInfo"></span><button id="next">다음</button></div>
    </section>
  </main>
  <div id="detailOverlay" class="detail-overlay hidden">
    <section class="detail-card" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <div class="detail-head"><h2 id="detailTitle">판매완료 상품 내용</h2><button type="button" id="detailClose" class="detail-close">✕</button></div>
      <div id="detailBody"></div>
      <div class="detail-actions"><button type="button" id="detailCopy">▣ 판매글 전체 복사</button></div>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://grace-im90.github.io/select-shop-writer/cloud.js?v=11"></script>
  <script>
    const $=id=>document.getElementById(id);let saved=[],page=1,detailProduct=null;const pageSize=50;
    function esc(value){return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
    function dateText(value){const date=new Date(value);return Number.isNaN(date.getTime())?"-":date.toLocaleDateString("ko-KR")}
    function measurementsOf(p){const value=p?.measurements;if(!value)return{};if(typeof value==="string"){try{return JSON.parse(value)||{}}catch(_error){return{}}}return typeof value==="object"?value:{}}
    function draftOf(p){const stored=measurementsOf(p);return stored.__draft&&typeof stored.__draft==="object"?stored.__draft:{}}
    function soldAtOf(p){const stored=measurementsOf(p);return p?.soldAt||stored.__soldAt||""}
    function isSold(p){return Boolean(soldAtOf(p))}
    function soldItems(){return saved.filter(isSold)}
    function activeItems(){return saved.filter(p=>!isSold(p))}
    function saveLocalSavedProduct(updated){const list=JSON.parse(localStorage.getItem("select-saved-products")||"[]"),pos=list.findIndex(item=>String(item.id)===String(updated.id));if(pos>=0)list[pos]=updated;else list.unshift(updated);localStorage.setItem("select-saved-products",JSON.stringify(list))}
    function removeSoldState(product){const measurements={...measurementsOf(product)};delete measurements.__soldAt;if(measurements.__status==="sold")delete measurements.__status;const updated={...product,measurements,updatedAt:new Date().toISOString()};delete updated.soldAt;delete updated.status;return updated}
    function filtered(){const q=$("query").value.toLowerCase().replace(/\s+/g,""),items=soldItems();if(!q)return items;return items.filter(p=>Object.values({name:p.name,brand:p.brand,size:p.size,price:p.price}).join(" ").toLowerCase().replace(/\s+/g,"").includes(q))}
    async function loadSaved(){try{await SelectCloud.ready();const cloud=SelectCloud.user?await SelectCloud.listSaved():null;saved=cloud??JSON.parse(localStorage.getItem("select-saved-products")||"[]")}catch(error){saved=[];$("status").textContent=error.message||"판매완료 상품을 불러오지 못했습니다."}$("soldTotal").textContent=soldItems().length.toLocaleString("ko-KR")+"개";$("activeTotal").textContent=activeItems().length.toLocaleString("ko-KR")+"개";render()}
    function showDetail(index){const p=saved[index];if(!p)return;detailProduct=p;$("detailTitle").textContent=[p.brand,p.name].filter(Boolean).join(" ")||"판매완료 상품 내용";$("detailBody").innerHTML=`<div class="detail-section"><h3>당근·후르츠 등록용 판매글</h3><p>${esc(savedText(p))}</p></div>`;$("detailOverlay").classList.remove("hidden")}
    function closeDetail(){detailProduct=null;$("detailOverlay").classList.add("hidden")}
    function savedText(p){const stored=measurementsOf(p),draft=draftOf(p);if(draft.finalText||stored.__finalText)return String(draft.finalText||stored.__finalText);const labels={chest:"가슴단면",length:"총기장",shoulder:"어깨",sleeve:"소매",waist:"허리단면",rise:"밑위",thigh:"허벅지",hem:"밑단"};const brand=draft.brand??p.brand??"",name=draft.name??p.name??"",size=draft.size??p.size??"-",condition=draft.condition??p.condition??"-",description=draft.description??stored.__description??p.description??"",notice=draft.notice??stored.__notice??"",measures=Object.entries(stored).filter(([k,v])=>!k.startsWith("__")&&v!==""&&v!=null).map(([k,v])=>`${labels[k]||k} ${v}cm`).join(" / ")||"-";return[[brand,name].filter(Boolean).join(" "),`브랜드 : ${brand||"-"}`,`표기 사이즈 : ${size}`,`컨디션 : ${condition}`,`실측 : ${measures}`,"",description||"상품 설명이 없습니다.","",notice].join("\n")}
    async function copyDetail(){if(!detailProduct)return;const text=savedText(detailProduct);try{await navigator.clipboard.writeText(text)}catch(_error){const area=document.createElement("textarea");area.value=text;document.body.appendChild(area);area.select();document.execCommand("copy");area.remove()}const button=$("detailCopy");button.textContent="✓ 복사 완료";setTimeout(()=>button.textContent="▣ 판매글 전체 복사",1200)}
    async function restoreSold(index){const current=saved[index];if(!current)return;const label=[current.brand,current.name].filter(Boolean).join(" ")||"이 상품";if(!confirm(`‘${label}’ 상품을 판매중 목록으로 되돌릴까요?`))return;const updated=removeSoldState(current);saved[index]=updated;try{if(window.SelectCloud&&SelectCloud.user)await SelectCloud.saveSaved(updated);else saveLocalSavedProduct(updated);await loadSaved()}catch(error){saved[index]=current;alert(error.message||"판매중으로 복원하지 못했습니다.")}}
    async function removeSaved(id,name){if(!confirm(`‘${name}’ 저장 상품을 삭제할까요?`))return;if(SelectCloud.user)await SelectCloud.deleteSaved(id);else{const next=saved.filter(item=>String(item.id)!==String(id));localStorage.setItem("select-saved-products",JSON.stringify(next))}await loadSaved()}
    function render(){const rows=filtered(),pages=Math.max(1,Math.ceil(rows.length/pageSize));page=Math.min(page,pages);const view=rows.slice((page-1)*pageSize,page*pageSize);$("status").textContent=`판매완료 상품 ${rows.length.toLocaleString("ko-KR")}개를 표시합니다.`;$("tableHead").innerHTML='<tr><th>번호</th><th>상품명</th><th>종류</th><th>사이즈</th><th>관리 가격</th><th>판매완료일</th><th class="hide-mobile">수정일</th><th>관리</th></tr>';$("tableBody").innerHTML=view.map((p,i)=>{const n=(page-1)*pageSize+i+1,index=saved.indexOf(p),label=esc([p.brand,p.name].filter(Boolean).join(" "));return`<tr><td class="muted">${n}</td><td class="product-name">${label}</td><td>${esc(p.productType)}</td><td>${esc(p.size)}</td><td class="money">${Number(p.price||0).toLocaleString("ko-KR")}원</td><td class="muted">${dateText(soldAtOf(p))}</td><td class="muted hide-mobile">${dateText(p.updatedAt)}</td><td><div class="actions"><button data-saved-open="${index}">내용 보기</button><button class="restore" data-restore="${index}">판매중 복원</button><button class="delete" data-delete="${p.id}" data-name="${label}">삭제</button></div></td></tr>`}).join("");$("empty").classList.toggle("hidden",view.length>0);$("empty").textContent="판매완료 처리한 상품이 없습니다.";$("tableBody").closest("table").classList.toggle("hidden",view.length===0);$("pageInfo").textContent=`${page} / ${pages}`;$("prev").disabled=page<=1;$("next").disabled=page>=pages;$("tableBody").querySelectorAll("[data-saved-open]").forEach(button=>button.onclick=()=>showDetail(Number(button.dataset.savedOpen)));$("tableBody").querySelectorAll("[data-restore]").forEach(button=>button.onclick=()=>restoreSold(Number(button.dataset.restore)));$("tableBody").querySelectorAll("[data-delete]").forEach(button=>button.onclick=()=>removeSaved(button.dataset.delete,button.dataset.name))}
    $("query").oninput=()=>{page=1;render()};$("prev").onclick=()=>{if(page>1){page--;render()}};$("next").onclick=()=>{page++;render()};$("detailClose").onclick=closeDetail;$("detailCopy").onclick=copyDetail;$("detailOverlay").onclick=e=>{if(e.target===$("detailOverlay"))closeDetail()};async function refreshCloud(){const button=$("cloudSync");if(button){button.disabled=true;button.textContent="새로고침 중…"}try{await loadSaved();if(SelectCloud.user)SelectCloud.setStatus(`${SelectCloud.user.email} · 동기화 완료`)}catch(error){SelectCloud.setStatus(error.message||"동기화에 실패했습니다.")}finally{if(button){button.disabled=false;button.textContent="↻ 지금 동기화"}}}$("cloudSync").onclick=refreshCloud;SelectCloud.bindAuth(refreshCloud);refreshCloud();
  </script>
</body>
</html>
