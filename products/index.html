<head>

  <style>
    :root{--ink:#172033;--muted:#687386;--blue:#356ae6;--soft:#eaf1ff;--line:#dfe5ed;--bg:#f4f7fb;--ok:#12a875}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}
    .top{display:flex;align-items:center;gap:24px;padding:22px 4vw;background:#fff;border-bottom:1px solid var(--line)}.brandline{color:var(--blue);font-size:10px;font-weight:800;letter-spacing:.14em}.top h1{margin:3px 0 0;font-size:26px;letter-spacing:-.04em}.top p{margin:0;padding-left:24px;border-left:1px solid var(--line);color:var(--muted);font-size:13px}.topnav{display:flex;gap:6px;margin-left:auto}.topnav a{padding:9px 13px;border-radius:8px;color:#627087;font-size:11px;font-weight:750;text-decoration:none}.topnav a.on{background:var(--blue);color:#fff}.topnav a:not(.on):hover{background:var(--soft);color:var(--blue)}
    .cloudbar{display:flex;align-items:center;gap:7px;padding:10px 4vw;border-bottom:1px solid var(--line);background:#f8faff}.cloudbar input{width:190px;height:35px;padding:0 12px;border:1px solid #d5dde7;border-radius:8px;outline:none;font-size:10px}.cloudbar button{height:35px;padding:0 12px;border:1px solid #cad6e8;border-radius:8px;background:#fff;color:#42516a;font-size:10px;font-weight:750}.cloudbar button.primary{border-color:var(--blue);background:var(--blue);color:#fff}.cloud-status{margin-left:auto;color:#718096;font-size:10px}.cloud-status.connected{color:var(--ok);font-weight:750}
    .wrap{width:min(1380px,calc(100% - 40px));margin:22px auto}.intro{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:16px}.intro h2{margin:0;font-size:24px}.intro p{margin:7px 0 0;color:var(--muted);font-size:12px}.intro-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.new{display:inline-flex;align-items:center;justify-content:center;height:41px;padding:0 16px;border-radius:9px;background:var(--blue);color:#fff;font-size:11px;font-weight:800;text-decoration:none}.new.secondary{border:1px solid #cad6e8;background:#fff;color:#42516a}.new.secondary:hover{border-color:var(--blue);color:var(--blue);background:var(--soft)}
    .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:15px}.summary article{padding:16px 18px;border:1px solid var(--line);border-radius:13px;background:#fff}.summary span{color:var(--muted);font-size:10px}.summary b{display:block;margin-top:5px;font-size:23px}
    .panel{overflow:hidden;border:1px solid var(--line);border-radius:15px;background:#fff;box-shadow:0 10px 30px rgba(23,32,51,.05)}.list-search-title{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 14px 0}.list-search-title b{font-size:12px}.list-search-title span{color:var(--muted);font-size:9px}.tools{display:flex;align-items:center;gap:10px;padding:14px;border-bottom:1px solid var(--line)}.tabs{display:flex;gap:5px}.tabs button{height:38px;padding:0 13px;border:0;border-radius:8px;background:#eef2f7;color:#697587;font-size:10px;font-weight:800}.tabs button.on{background:var(--blue);color:#fff}.search{position:relative;flex:1}.search input{width:100%;height:40px;padding:0 13px 0 37px;border:1px solid #d6dee8;border-radius:9px;outline:none}.search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(53,106,230,.1)}.search span{position:absolute;left:13px;top:9px;color:var(--blue);font-size:18px}
    .detail-overlay{position:fixed;z-index:100;inset:0;display:grid;place-items:center;padding:20px;background:rgba(15,23,42,.55)}.detail-card{width:min(720px,100%);max-height:90vh;overflow:auto;padding:22px;border-radius:16px;background:#fff;box-shadow:0 24px 70px rgba(0,0,0,.25)}.detail-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:16px}.detail-head h2{margin:0;font-size:20px}.detail-close{width:34px;height:34px;border:0;border-radius:8px;background:#eef2f7;color:#526075;font-weight:800}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.detail-item{padding:11px;border:1px solid var(--line);border-radius:9px;background:#f8fafd}.detail-item span{display:block;margin-bottom:4px;color:#8490a1;font-size:9px}.detail-item b{font-size:11px}.detail-section{margin-top:12px;padding:14px;border:1px solid var(--line);border-radius:10px}.detail-section h3{margin:0 0 9px;font-size:11px}.detail-section p{margin:0;color:#445064;font-size:11px;line-height:1.7;white-space:pre-wrap}.detail-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.detail-actions button{height:42px;border:0;border-radius:9px;font-size:11px;font-weight:800}.detail-actions .edit{background:var(--blue);color:#fff}.detail-actions .cancel{background:#eef2f7;color:#526075}
    .edit-form{display:grid;grid-template-columns:1fr 1fr;gap:13px}.edit-form .full{grid-column:1/-1}.edit-form label{display:block;margin-bottom:6px;color:#526075;font-size:10px;font-weight:800}.edit-form input,.edit-form select,.edit-form textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font:inherit}.edit-form textarea{min-height:110px;resize:vertical}.edit-measures{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#f8fafd}.edit-status{min-height:18px;margin-top:10px;color:var(--ok);font-size:10px;text-align:center}
    .tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{padding:11px 13px;background:#f8fafd;color:#778397;font-size:9px;text-align:left}td{padding:12px 13px;border-top:1px solid #edf0f4;font-size:10.5px}.product-name{max-width:360px;overflow:hidden;text-overflow:ellipsis;font-weight:750}.muted{color:#8994a4}.money{font-weight:800;text-align:right}.upload-sites{display:flex;align-items:center;gap:6px;min-width:188px}.upload-check{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 8px;border:1px solid #d6dee8;border-radius:7px;background:#fff;color:#526075;font-size:9px;font-weight:750}.upload-check:has(input:checked){border-color:#b9cdf8;background:#f7faff;color:var(--blue)}.upload-check input{width:13px;height:13px;margin:0;accent-color:var(--blue)}.upload-check.saving{opacity:.55}.actions{display:flex;gap:5px}.actions a,.actions button{display:inline-flex;align-items:center;justify-content:center;height:28px;padding:0 9px;border:0;border-radius:7px;background:#edf3ff;color:var(--blue);font-size:9px;font-weight:750;text-decoration:none}.actions button.sold{background:#172033;color:#fff}.actions button.delete{background:#fff0f0;color:#c33}.empty{padding:60px 20px;text-align:center;color:#8a95a5;font-size:11px}.pager{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;border-top:1px solid var(--line)}.pager button{height:30px;padding:0 10px;border:1px solid var(--line);border-radius:7px;background:#fff;color:#627087;font-size:9px}.pager button:disabled{opacity:.35;cursor:default}.pager span{color:#687386;font-size:10px}.status{padding:9px 14px;border-bottom:1px solid var(--line);background:#fbfcfe;color:#687386;font-size:9px}.hidden{display:none!important}
    @media(max-width:760px){.top{padding:14px 17px;flex-wrap:wrap}.top h1{font-size:20px}.top p{display:none}.topnav{display:grid;grid-template-columns:repeat(4,1fr);width:100%;margin:0}.topnav a{text-align:center;padding:9px 5px}.cloudbar{padding:9px 11px;flex-wrap:wrap}.cloudbar input{width:calc(50% - 4px)}.cloudbar button{flex:1}.cloud-status{width:100%;margin:2px 0 0;text-align:center}.wrap{width:calc(100% - 22px);margin:13px auto}.intro{align-items:start}.intro h2{font-size:20px}.intro p{font-size:10px}.intro-actions{width:100%;display:grid;grid-template-columns:1fr 1fr}.new{height:37px;padding:0 11px}.summary{grid-template-columns:1fr;gap:8px}.summary article{padding:13px}.summary b{font-size:19px}.tools{align-items:stretch;flex-direction:column}.tabs{display:grid;grid-template-columns:1fr 1fr}.search input{height:42px}th,td{padding:10px;font-size:9px}.detail-grid{grid-template-columns:1fr}.detail-card{padding:17px}.product-name{max-width:230px}.hide-mobile{display:none}}
  </style>

<body>
  <header class="top"><div><div class="brandline">SELECT SHOP 343</div><h1>셀렉상회 상품 목차</h1></div><p>저장 상품과 불러온 엑셀 상품을 한곳에서 확인합니다.</p><nav class="topnav"><a href="https://grace-im90.github.io/select-shop-writer/?app=26&new=1" target="_top">판매글 작성</a><a class="on" href="https://grace-im90.github.io/select-shop-writer/products/?app=26" target="_top">상품 목차</a><a href="https://grace-im90.github.io/select-shop-writer/products/sold/?app=26" target="_top">판매완료</a><a href="https://grace-im90.github.io/select-shop-writer/camera/?app=26" target="_top">카메라 촬영</a></nav></header>
  <section class="cloudbar">
    <input id="cloudEmail" type="email" placeholder="클라우드 로그인 이메일" autocomplete="email">
    <input id="cloudPassword" type="password" placeholder="비밀번호 6자리 이상" autocomplete="current-password">
    <button id="cloudLogin" class="primary" type="button">로그인</button>
    <button id="cloudSignup" type="button">회원가입</button>
    <button id="cloudLogout" class="hidden" type="button">로그아웃</button>
    <button id="cloudSync" class="hidden" type="button">↻ 지금 동기화</button>
    <span id="cloudStatus" class="cloud-status">클라우드 연결 준비 중…</span>
  </section>
  <main class="wrap">
    <div class="intro"><div><h2>상품 목록</h2><p>판매완료 처리한 상품은 이 목록에서 숨겨지고 판매완료 페이지로 이동합니다.</p></div><div class="intro-actions"><a class="new secondary" href="https://grace-im90.github.io/select-shop-writer/products/sold/?app=26" target="_top">판매완료 목록</a><a class="new" href="https://grace-im90.github.io/select-shop-writer/?app=26&new=1" target="_top">＋ 새 판매글 작성</a></div></div>
    <section class="summary"><article><span>판매중 상품</span><b id="savedTotal">0개</b></article><article><span>판매완료</span><b id="soldTotal">0개</b></article><article><span>엑셀·Google 상품</span><b id="catalogTotal">0개</b></article></section>
    <section class="panel">
      <div class="list-search-title"><b>등록 상품 검색</b><span>상품명을 클릭하면 제목이 복사됩니다.</span></div>
      <div class="tools">
        <div class="tabs"><button id="savedTab" class="on">저장한 판매 상품</button><button id="catalogTab">엑셀·Google 상품</button></div>
        <div class="search"><span>⌕</span><input id="query" placeholder="상품명·브랜드·코드·바코드 검색" autocomplete="off"></div>
      </div>
      <div id="status" class="status">상품 목록을 불러오는 중입니다.</div>
      <div class="tablewrap"><table><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table><div id="empty" class="empty hidden"></div></div>
      <div class="pager"><button id="prev">이전</button><span id="pageInfo"></span><button id="next">다음</button></div>
    </section>
  </main>
  <div id="detailOverlay" class="detail-overlay hidden">
    <section class="detail-card" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <div class="detail-head"><h2><button type="button" id="detailTitle" class="copy-title" data-copy-title title="클릭해서 제목 복사">저장 상품 내용</button></h2><button type="button" id="detailClose" class="detail-close">✕</button></div>
      <div id="detailBody"></div>
      <div class="detail-actions" style="grid-template-columns:1fr"><button type="button" id="detailCopy" class="edit">▣ 판매글 전체 복사</button></div>
    </section>
  </div>
  <div id="editOverlay" class="detail-overlay hidden">
    <section class="detail-card" role="dialog" aria-modal="true" aria-labelledby="editTitle">
      <div class="detail-head"><h2 id="editTitle">저장 상품 수정</h2><button type="button" id="editClose" class="detail-close">✕</button></div>
      <div class="edit-form">
        <div><label for="editBrand">브랜드</label><input id="editBrand" autocomplete="off"></div>
        <div><label for="editName">상품명</label><input id="editName"></div>
        <div><label for="editType">상품 종류</label><select id="editType"><option>상의</option><option>하의</option><option>아우터</option><option>원피스</option><option>신발</option></select></div>
        <div><label for="editSize">표기 사이즈</label><input id="editSize"></div>
        <div><label for="editCondition">컨디션</label><select id="editCondition"><option>S 새상품급</option><option>A 매우 좋은 상태</option><option>B+ 좋은 상태</option><option>B 보통 상태</option><option>C 사용감 있음</option></select></div>
        <div><label for="editPrice">관리용 판매가격</label><input id="editPrice" type="number" inputmode="numeric" min="0"></div>
        <div class="full" id="editMeasureSection"><label>실측 사이즈 (cm)</label><div id="editMeasures" class="edit-measures"></div></div>
        <div class="full"><label for="editDescription">상품 설명</label><textarea id="editDescription"></textarea></div>
        <div class="full"><label for="editNotice">구매 전 확인사항</label><textarea id="editNotice"></textarea></div>
      </div>
      <div id="editStatus" class="edit-status"></div>
      <div class="detail-actions"><button type="button" id="editCancel" class="cancel">취소</button><button type="button" id="editSave" class="edit">수정 내용 저장</button></div>
    </section>
  </div>
  <script src="../title-copy.js?v=3"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://grace-im90.github.io/select-shop-writer/cloud.js?v=16"></script>
  <script>
    const $=id=>document.getElementById(id);let saved=[],catalog=[],mode="saved",page=1;const pageSize=50,uploadSites=[["carrot","당근"],["bunjang","번개장터"],["fruits","후르츠"]];
    function esc(value){return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
    function dateText(value){const date=new Date(value);return Number.isNaN(date.getTime())?"-":date.toLocaleDateString("ko-KR")}
    async function loadCatalog(){try{await SelectCloud.ready();const cloud=SelectCloud.user?await SelectCloud.listCatalog():null;catalog=cloud??JSON.parse(localStorage.getItem("select-local-products")||"[]")}catch(e){catalog=[]}$("catalogTotal").textContent=catalog.length.toLocaleString("ko-KR")+"개"}
    async function loadSaved(){try{await SelectCloud.ready();const cloud=SelectCloud.user?await SelectCloud.listSaved():null;saved=cloud??JSON.parse(localStorage.getItem("select-saved-products")||"[]");updateSavedCounts()}catch(error){saved=[];updateSavedCounts();$("status").textContent=error.message||"저장 상품을 불러오지 못했습니다."}render()}
    function updateSavedCounts(){const active=saved.filter(p=>!isSold(p)).length,soldCount=saved.filter(isSold).length;$("savedTotal").textContent=active.toLocaleString("ko-KR")+"개";$("soldTotal").textContent=soldCount.toLocaleString("ko-KR")+"개"}
    function productCreatedTime(p){const created=Date.parse(p?.createdAt||"");if(Number.isFinite(created))return created;const numericId=Number(p?.id);if(Number.isFinite(numericId))return numericId;const fallback=Date.parse(p?.updatedAt||"");return Number.isFinite(fallback)?fallback:0}
    function filtered(){const q=$("query").value.toLowerCase().replace(/\s+/g,"");const source=mode==="saved"?saved.filter(p=>!isSold(p)).slice().sort((a,b)=>productCreatedTime(b)-productCreatedTime(a)||String(b.id??"").localeCompare(String(a.id??""))):catalog;if(!q)return source;return source.filter(p=>Object.values({name:p.name,brand:p.brand,code:p.code,barcode:p.barcode,size:p.size}).join(" ").toLowerCase().replace(/\s+/g,"").includes(q))}
    let detailProduct=null;
    function measurementsOf(p){const value=p?.measurements;if(!value)return{};if(typeof value==="string"){try{return JSON.parse(value)||{}}catch(_error){return{}}}return typeof value==="object"?value:{}}
    function draftOf(p){const stored=measurementsOf(p);return stored.__draft&&typeof stored.__draft==="object"?stored.__draft:{}}
    function soldAtOf(p){const stored=measurementsOf(p);return p?.soldAt||stored.__soldAt||""}
    function isSold(p){return Boolean(soldAtOf(p))}
    function uploadState(p){let source=p?.uploadSites??measurementsOf(p).__uploadSites??{};if(typeof source==="string"){try{source=JSON.parse(source)}catch(_error){source={}}}return Object.fromEntries(uploadSites.map(([key,label])=>[key,Array.isArray(source)?source.includes(key)||source.includes(label):Boolean(source?.[key]||source?.[label])]))}
    function uploadControls(p,index){const state=uploadState(p);return`<div class="upload-sites">${uploadSites.map(([key,label])=>`<label class="upload-check"><input type="checkbox" data-upload-index="${index}" data-upload-site="${key}" ${state[key]?"checked":""} aria-label="${label} 업로드 완료"><span>${label}</span></label>`).join("")}</div>`}
    function saveLocalSavedProduct(updated){const list=JSON.parse(localStorage.getItem("select-saved-products")||"[]"),pos=list.findIndex(item=>String(item.id)===String(updated.id));if(pos>=0)list[pos]=updated;else list.unshift(updated);localStorage.setItem("select-saved-products",JSON.stringify(list))}
    async function markSold(index){const current=saved[index];if(!current)return;const label=[current.brand,current.name].filter(Boolean).join(" ")||"이 상품";if(!confirm(`‘${label}’ 상품을 판매완료 처리할까요?\n상품 목차에서는 숨겨지고 판매완료 페이지로 이동합니다.`))return;const soldAt=new Date().toISOString(),nextMeasurements={...measurementsOf(current),__soldAt:soldAt,__status:"sold"},updated={...current,soldAt,measurements:nextMeasurements,updatedAt:soldAt};saved[index]=updated;try{if(window.SelectCloud&&SelectCloud.user)await SelectCloud.saveSaved(updated);else saveLocalSavedProduct(updated);await loadSaved()}catch(error){saved[index]=current;alert(error.message||"판매완료 처리하지 못했습니다.")}}
    async function toggleUploadSite(index,key,checked,input){const current=saved[index];if(!current)return;const label=input?.closest(".upload-check"),nextState={...uploadState(current),[key]:checked},updated={...current,uploadSites:nextState,measurements:{...measurementsOf(current),__uploadSites:nextState},updatedAt:new Date().toISOString()};saved[index]=updated;if(input){input.disabled=true;label?.classList.add("saving")}try{if(window.SelectCloud&&SelectCloud.user)await SelectCloud.saveSaved(updated);else saveLocalSavedProduct(updated);if(detailProduct&&String(detailProduct.id)===String(updated.id))detailProduct=updated}catch(error){saved[index]=current;if(input)input.checked=!checked;alert(error.message||"업로드 체크 상태를 저장하지 못했습니다.")}finally{if(input){input.disabled=false;label?.classList.remove("saving")}}}
    function showSavedDetail(index){const p=saved[index];if(!p)return;detailProduct=p;$("detailTitle").textContent=[p.brand,p.name].filter(Boolean).join(" ")||"저장 판매글 내용";$("detailBody").innerHTML=`<div class="detail-section" style="border-color:#b9cdf8;background:#f7faff"><h3>당근·후르츠 등록용 판매글</h3><p>${esc(savedText(p))}</p></div>`;$("detailOverlay").classList.remove("hidden")}
    function closeDetail(){detailProduct=null;$("detailOverlay").classList.add("hidden")}
    const measureFieldsByType={상의:[["length","총장"],["shoulder","어깨"],["chest","가슴"],["sleeve","소매"]],아우터:[["length","총장"],["shoulder","어깨"],["chest","가슴"],["sleeve","소매"]],원피스:[["length","총장"],["shoulder","어깨"],["chest","가슴"],["waist","허리"],["sleeve","소매"]],하의:[["length","총장"],["waist","허리"],["hip","엉덩이"],["thigh","허벅지"],["rise","밑위"],["hem","밑단"]],신발:[]};
    function composeProductText(d){const type=d.productType||"상의",shoe=type==="신발",fields=measureFieldsByType[type]||measureFieldsByType.상의,measures=fields.filter(([key])=>d.measurements?.[key]!==""&&d.measurements?.[key]!=null).map(([key,label])=>`${label} ${d.measurements[key]}cm`).join(" / ")||"-";return[[d.brand,d.name].filter(Boolean).join(" "),`브랜드 : ${d.brand||"-"}`,`${shoe?"사이즈":"표기 사이즈"} : ${d.size||"-"}`,`컨디션 : ${d.condition||"-"}`,...(shoe?[]:[`실측 : ${measures}`]),"",d.description||"상품 설명이 없습니다.","",d.notice||""].join("\n")}

    async function saveEdit(){if(!editProduct)return;const d=editDraft();if(!d.name){$("editStatus").textContent="상품명을 입력해 주세요.";return}const finalText=composeEditText(d),existingUploads=uploadState(editProduct),existingSoldAt=soldAtOf(editProduct),existingMeasurements=measurementsOf(editProduct),existingCode=existingMeasurements.__productCode||editProduct.code||"",existingImage=existingMeasurements.__productImage??editProduct.productImage,snapshot={...d.measurements,__uploadSites:existingUploads,__draft:{...d,finalText},__finalText:finalText,__description:d.description,__notice:d.notice,__savedVersion:5};if(existingCode)snapshot.__productCode=existingCode;if(existingImage!==undefined)snapshot.__productImage=existingImage;if(existingSoldAt){snapshot.__soldAt=existingSoldAt;snapshot.__status="sold"}const updated={...editProduct,...d,uploadSites:existingUploads,measurements:snapshot,updatedAt:new Date().toISOString()};if(existingSoldAt)updated.soldAt=existingSoldAt;const button=$("editSave");button.disabled=true;button.textContent="저장 중…";try{if(window.SelectCloud&&SelectCloud.user){await SelectCloud.saveSaved(updated)}else saveLocalSavedProduct(updated);const brands=JSON.parse(localStorage.getItem("select-saved-brands")||"[]");if(d.brand&&!brands.some(b=>String(b).toLowerCase()===d.brand.toLowerCase()))localStorage.setItem("select-saved-brands",JSON.stringify([d.brand,...brands]));$("editStatus").textContent="수정 내용을 저장했습니다.";await loadSaved();setTimeout(closeEdit,350)}catch(error){$("editStatus").textContent=error.message||"저장하지 못했습니다."}finally{button.disabled=false;button.textContent="수정 내용 저장"}}

    function render(){const rows=filtered();const pages=Math.max(1,Math.ceil(rows.length/pageSize));page=Math.min(page,pages);const view=rows.slice((page-1)*pageSize,page*pageSize);$("savedTab").classList.toggle("on",mode==="saved");$("catalogTab").classList.toggle("on",mode==="catalog");$("status").textContent=mode==="saved"?`판매중 상품 ${rows.length.toLocaleString("ko-KR")}개를 표시합니다. 판매완료 상품은 별도 페이지에 보관됩니다.`:`현재 브라우저에 불러온 엑셀·Google 상품 ${rows.length.toLocaleString("ko-KR")}개를 표시합니다.`;$("tableHead").innerHTML=mode==="saved"?'<tr><th>번호</th><th>상품명</th><th>업로드 확인</th><th>종류</th><th>사이즈</th><th>관리 가격</th><th class="hide-mobile">수정일</th><th class="detail-cell" scope="col">내용</th><th scope="col">관리</th></tr>':'<tr><th>번호</th><th>상품명</th><th>브랜드</th><th>사이즈</th><th class="hide-mobile">상품코드</th><th class="hide-mobile">바코드</th><th>가격</th><th>관리</th></tr>';$("tableBody").innerHTML=view.map((p,i)=>{const n=(page-1)*pageSize+i+1;if(mode==="saved"){const savedIndex=saved.indexOf(p),label=esc([p.brand,p.name].filter(Boolean).join(" "));return`<tr><td class="muted">${n}</td><td class="product-name"><button type="button" class="copy-title" data-copy-title title="클릭해서 제목 복사">${label}</button></td><td>${uploadControls(p,savedIndex)}</td><td>${esc(p.productType)}</td><td>${esc(p.size)}</td><td class="money">${Number(p.price||0).toLocaleString("ko-KR")}원</td><td class="muted hide-mobile">${dateText(p.updatedAt)}</td><td class="detail-cell"><div class="actions"><button type="button" data-saved-open="${savedIndex}">내용 보기</button></div></td><td><div class="actions"><button data-saved-edit="${savedIndex}">수정</button><button class="sold" data-saved-sold="${savedIndex}">판매완료</button><button class="delete" data-delete="${p.id}" data-name="${label}">삭제</button></div></td></tr>`}const originalIndex=catalog.indexOf(p);return`<tr><td class="muted">${n}</td><td class="product-name"><button type="button" class="copy-title" data-copy-title title="클릭해서 제목 복사">${esc(p.name)}</button></td><td>${esc(p.bran     $("editType").onchange=()=>{document.querySelectorAll("[data-edit-measure]").forEach(input=>editMeasurements[input.dataset.editMeasure]=input.value);renderEditMeasures()};$("editClose").onclick=closeEdit;$("editCancel").onclick=closeEdit;$("editSave").onclick=saveEdit;$("editOverlay").onclick=e=>{if(e.target===$("editOverlay"))closeEdit()};
